name: Build signed secure Operator image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GHCR tag to create after final review
        required: true
        type: string
      manager_module_commit:
        description: Full companion secure Manager commit used by every Manager module
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: secure-operator-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and secure Manager dependency
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate immutable publication inputs
        id: metadata
        env:
          MANAGER_COMMIT: ${{ inputs.manager_module_commit }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "sophena/secure-manager-registration" ]]; then
            echo "This workflow may only publish the reviewed sophena/secure-manager-registration branch." >&2
            exit 1
          fi
          if [[ ! "${MANAGER_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "manager_module_commit must be a lowercase 40-character Git commit." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "tag is not a valid immutable OCI tag." >&2
            exit 1
          fi
          if rg -n '=>[[:space:]]*(\.{1,2}/|/|file:)' go.mod; then
            echo "Local filesystem module replacements are forbidden in release source." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/scylla-operator" >> "${GITHUB_OUTPUT}"
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify the pinned secure Manager modules
        env:
          MANAGER_COMMIT: ${{ inputs.manager_module_commit }}
        run: |
          set -euo pipefail

          short_commit="${MANAGER_COMMIT:0:12}"
          modules=(
            github.com/scylladb/scylla-manager/v3/pkg/managerclient
            github.com/scylladb/scylla-manager/v3/pkg/util
            github.com/scylladb/scylla-manager/v3/swagger
          )
          for module in "${modules[@]}"; do
            module_json="$(go list -mod=mod -m -json "${module}")"
            effective_path="$(jq -r '.Replace.Path // .Path' <<< "${module_json}")"
            effective_version="$(jq -r '.Replace.Version // .Version' <<< "${module_json}")"
            if [[ "${effective_version}" != *-"${short_commit}" ]]; then
              echo "${module} resolves to ${effective_path}@${effective_version}, not secure Manager commit ${MANAGER_COMMIT}." >&2
              exit 1
            fi
          done

          go mod verify

      - name: Run unit tests
        run: go test ./pkg/...

      - name: Run focused race tests
        run: >-
          go test -race
          ./pkg/api/scylla/validation
          ./pkg/controller/scyllacluster
          ./pkg/controller/scylladbdatacenter
          ./pkg/controller/scylladbmanagerclusterregistration
          ./pkg/controller/scylladbmanagertask
          ./pkg/controllerhelpers
          ./pkg/managerclientsecure
          ./pkg/naming

      - name: Run static analysis
        run: go vet ./pkg/...

  publish:
    name: Publish, attest, and sign amd64/arm64 image
    needs: verify
    runs-on: ubuntu-latest
    environment: secure-image-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} already exists; immutable tags are never overwritten." >&2
            exit 1
          fi

      - name: Build and push the multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
          sbom: true
          provenance: mode=max

      - name: Verify the immutable index platforms
        id: platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -euo pipefail

          manifest="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw)"
          actual="$(jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' <<< "${manifest}" | sort -u)"
          expected=$'linux/amd64\nlinux/arm64'
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'Unexpected image platforms:\n%s\n' "${actual}" >&2
            exit 1
          fi

          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "${manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "${manifest}")"
          echo "amd64_digest=${amd64_digest}" >> "${GITHUB_OUTPUT}"
          echo "arm64_digest=${arm64_digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable image digest with GitHub OIDC
        env:
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64_digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -euo pipefail
          for digest in "${DIGEST}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"; do
            cosign sign --yes "${IMAGE}@${digest}"
          done

      - name: Publish GitHub OIDC index provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub OIDC amd64 provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.amd64_digest }}
          push-to-registry: true

      - name: Publish GitHub OIDC arm64 provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.arm64_digest }}
          push-to-registry: true

      - name: Record immutable publication coordinates
        env:
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64_digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.verify.outputs.image }}
          MANAGER_COMMIT: ${{ inputs.manager_module_commit }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          {
            printf 'image=%s@%s\n' "${IMAGE}" "${DIGEST}"
            printf 'amd64=%s@%s\n' "${IMAGE}" "${AMD64_DIGEST}"
            printf 'arm64=%s@%s\n' "${IMAGE}" "${ARM64_DIGEST}"
            printf 'tag=%s:%s\n' "${IMAGE}" "${TAG}"
            printf 'source_commit=%s\n' "${GITHUB_SHA}"
            printf 'manager_commit=%s\n' "${MANAGER_COMMIT}"
            printf 'platforms=linux/amd64,linux/arm64\n'
            printf 'sbom=oci-attestation\n'
            printf 'provenance=github-oidc\n'
          } > secure-operator-image.txt

      - name: Upload immutable image coordinates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-operator-image-${{ github.sha }}
          path: secure-operator-image.txt
          if-no-files-found: error
          retention-days: 90
